    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Insightrix 서비스 도입 및 제휴 문의</title>
    <link rel="icon" href="Insightrix.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body class="bg-[#090d16] text-slate-100 min-h-screen flex flex-col bg-grid-dots selection:bg-sky-500/30 selection:text-sky-200">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PLHLHFBM" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>

    <!-- Sticky Glassmorphic Navbar -->
    <nav class="sticky top-0 z-50 backdrop-blur-md bg-[#090d16]/90 border-b border-slate-800/80 px-6 md:px-12 py-4 flex justify-between items-center transition-all duration-300">
        <a href="/index.html" class="flex items-center gap-2.5 group z-10">
            <img src="/Insightrix.png" alt="Insightrix Logo" class="h-7 w-auto object-contain transition-transform duration-200 group-hover:scale-105">
            <span class="font-extrabold text-base tracking-wider text-white">INSIGHTRIX</span>
        </a>
        <div class="hidden md:flex gap-8 items-center z-10">
            <a href="/index.html" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors">Home</a>
            <a href="/accountingflow.html" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors">AccountingFlow</a>
            <a href="/auditflow.html" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors">AuditFlow</a>
            <a href="/operationsflow.html" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors">OperationsFlow</a>
            <a href="/company.html" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors">Company</a>
            <a href="/contact.html" class="text-xs font-bold text-sky-400 border-b-2 border-sky-400 pb-0.5">Contact</a>
            <a href="/app.html" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-4 py-2 rounded-lg text-xs tracking-tight transition-all duration-200 shadow-md">요금 및 다운로드</a>
        </div>
        <!-- Mobile Nav Trigger -->
        <button class="md:hidden text-slate-400 hover:text-white focus:outline-none z-10" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
            <i class="fa-solid fa-bars text-lg"></i>
        </button>
    </nav>

    <!-- Subpage Hero Header -->
    <header class="py-16 px-6 text-center border-b border-slate-800/60 relative">
        <div class="max-w-3xl mx-auto space-y-4">
            <span class="inline-block px-3.5 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-[11px] font-bold text-sky-400 uppercase tracking-wider">
                도입 문의 및 파트너십
            </span>
            <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight">서비스 도입 및 기술 제휴 문의</h1>
            <p class="text-xs md:text-sm text-slate-400 leading-relaxed max-w-2xl mx-auto">
                기업 도입 상담, 파일럿 테스트 신청, 기술 파트너십 제안 등 필요하신 사항을 작성해주시면 전담 엔지니어가 신속히 안내해 드립니다.
            </p>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-6 md:px-12 py-16 w-full">
        <div class="saas-card p-8 md:p-12 shadow-2xl">
            <form action="https://formspree.io/f/xovvqkgb" method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-300">성함 (Name) <span class="text-sky-400">*</span></label>
                        <input type="text" name="name" required placeholder="홍길동" class="w-full bg-slate-900 border border-slate-700/80 rounded-lg px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-colors">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-300">이메일 (Email) <span class="text-sky-400">*</span></label>
                        <input type="email" name="email" required placeholder="name@company.com" class="w-full bg-slate-900 border border-slate-700/80 rounded-lg px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-colors">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-300">소속 회사 / 기관명 (Company / Org)</label>
                    <input type="text" name="company" placeholder="(주) 인사이트릭스" class="w-full bg-slate-900 border border-slate-700/80 rounded-lg px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-colors">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-300">문의 내용 (Message) <span class="text-sky-400">*</span></label>
                    <textarea name="message" rows="5" required placeholder="도입을 검토 중이신 솔루션(AccountingFlow / AuditFlow) 및 문의 사항을 자유롭게 적어주세요." class="w-full bg-slate-900 border border-slate-700/80 rounded-lg px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-colors"></textarea>
                </div>

                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3.5 rounded-lg text-xs tracking-tight transition-all duration-200 shadow-lg shadow-sky-600/20">
                    문의 제출하기 <i class="fa-solid fa-paper-plane ml-1.5 text-[10px]"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#090d16] border-t border-slate-800/80 py-12 px-6 md:px-12 text-center md:text-left">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center text-xs text-slate-500 gap-4">
            <div class="flex items-center gap-2">
                <img src="/Insightrix.png" alt="Insightrix Logo" class="h-5 w-auto">
                <span class="font-bold text-slate-300">INSIGHTRIX</span>
            </div>
            <p>© 2026 Insightrix Corp. All Rights Reserved.</p>
        </div>
    </footer>
</body>

</html>
